name: Pull request checks
on:
  pull_request:
    paths: ["src/**", "public/**", "functions/**", "index.html", "package.json", "package-lock.json", "vite.config.ts", "tsconfig*.json", "firebase.json", "firestore.rules", "firestore.indexes.json", "storage.rules", ".github/workflows/**"]
concurrency:
  group: uniqexclusives-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run build && npm test
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: functions/package-lock.json }
      - run: npm ci --prefix functions
      - run: npm run lint --prefix functions && npm test --prefix functions
